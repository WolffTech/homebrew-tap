name: Update casks

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register local tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/wolfftech"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/wolfftech/homebrew-tap"
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Update versions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_casks.py
      # PR checks on bot-opened PRs wait for manual approval. Validate here too.
      - name: Validate recipes
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          for cask in Casks/*.rb; do ruby -c "$cask"; done
          brew style Casks/*.rb
          brew audit --cask --strict --online --tap=wolfftech/tap
          brew livecheck --cask --tap=wolfftech/tap
      # Commit with git and open the PR with gh rather than a third-party action.
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-casks
          TITLE: "chore(casks): update stable releases"
        run: |
          if git diff --quiet -- Casks; then
            echo "Casks are current"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add Casks/*.rb
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" != OPEN ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "$TITLE" --body-file .github/update-casks-pr.md
          fi
