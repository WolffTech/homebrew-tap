name: Update casks

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register local tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/wolfftech"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/wolfftech/homebrew-tap"
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Update versions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_casks.py
      # GITHUB_TOKEN PRs do not trigger pull_request workflows. Validate here too.
      - name: Validate recipes
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          for cask in Casks/*.rb; do ruby -c "$cask"; done
          brew style Casks/*.rb
          brew audit --cask --strict --online --tap=wolfftech/tap
          brew livecheck --cask --tap=wolfftech/tap
      - name: Open or update the release PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/update-casks
          add-paths: Casks/*.rb
          commit-message: "chore(casks): update stable releases"
          title: "chore(casks): update stable releases"
          body: |
            Update casks from stable WolffTech GitHub Releases. SHA-256 values were calculated from the downloaded DMGs.

            Before merging, inspect the new bundles for changes to architecture, minimum macOS, signing, notarization, and uninstall behavior. Run lifecycle tests in a disposable macOS environment.

            This workflow validates syntax, style, audit, release discovery, and updater tests before opening the PR. GITHUB_TOKEN does not trigger the separate PR checks workflow.
